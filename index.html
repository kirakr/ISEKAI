<script>
// [年, 題, 称号, 名, 教科書本文(**=重要語), 重要語, 史料(別角度), 読み]
const C=[
[1,"女神の降臨","女神","アルセイア","聖暦元年、女神アルセイアが混沌の大地に降臨し、人間に魔力の扱いを教えた。この**魔法**の授与が文明の起点とされ、紀年法の聖暦もこの年を元年とする。ただし同時代の記録はなく、神話としての性格が強い。","魔法","『実録』序文：「最初の夜が明けたとき、人は掌に灯をともすことを覚えた」","まほう"],
[98,"竜との盟約","王","エルド","辺境の開拓民は竜の炎に脅かされていた。初代王エルドは山頂に棲む竜王ヴァルガと**盟約**を結び、竜に王国の守護を担わせた。この結果、王権は神聖視され、即位の儀式にも竜の名が刻まれるようになった。","盟約","旅商の手記：「山の主は王の杯に爪を浸し、その日から麓の村は焼かれなくなった」","めいやく"],
[120,"勇者召喚の儀","王","ガイウス","魔物の侵攻に苦しんだ王ガイウスは、禁じられた**召喚**陣を起動した。異界の者を呼ぶ術は神への冒涜とされたが、国難を理由に例外が認められた。以後、呼ばれた者に「勇者」の称号を授ける慣例が定着した。","召喚","神官の覚書：「床の円環が三夜光り、見知らぬ装いの若者が現れた」","しょうかん"],
[245,"第一次魔王戦争","勇者","タクミ","北方に魔王ザガンが出現し、諸国は三年に及ぶ戦争に入った。勇者タクミは仲間とともに魔王城へ進み、聖剣で魔王を**討伐**した。この勝利で勇者は王国の最高戦力として制度化された。","討伐","従軍僧の日記：「聖剣は魔王の胸に沈み、扉は閉ざされた。静寂だけが残った」","とうばつ"],
[310,"エルフ和平","女王","リーシア","森林伐採をめぐる人間とエルフの戦争は、女王リーシアの決断で終結した。条約は人間の立ち入りを禁じる**不可侵**の領域を定め、森は事実上の独立地となった。これにより西方の交易が安定した。","不可侵","和平会議の記録：「境の樹に印を刻み、そこから先へ人の足は進まぬと誓った」","ふかしん"],
[389,"冒険者ギルド創設","ギルド長","ガルド","魔物退治は従来、騎士団の任務だった。商人ガルドは依頼の仲介所を設け、実力に応じてFからSまでの**ランク**を与えた。これにより魔物退治は国家の義務から民間の職業へ転換した。","ランク","新人冒険者の手紙：「掲示板の依頼は、腕前を示す札の色で受けられるものが決まる」",""],
[452,"勇者追放事件","宰相","ヴァルド","宰相ヴァルドは戦闘力の数値だけで人を評価し、勇者アキラを「無能」として追放した。勇者は辺境で新国家を興し、人材を失った王国は財政と軍事の両面で**衰退**した。","衰退","辺境の農夫の話：「追われた若者の周りに人が集まり、いつしか城壁が立った」","すいたい"],
[518,"悪役令嬢の婚約破棄","王太子","ユリウス","王太子ユリウスは夜会で婚約者セレスティアを糾弾したが、令嬢の提出した証拠により讒言が露見した。王太子は王位継承権を失い**廃嫡**され、以後、王室は貴族の合議を重んじた。","廃嫡","給仕の証言：「広間が静まり返り、殿下は継ぐはずだった座から遠ざけられた」","はいちゃく"],
[573,"鑑定魔道具の発明","大賢者","サトウ","異界から来た転生者サトウは、能力を数値で示す魔道具を発明した。誰もが自分の**ステータス**を確認できるようになり、職業選択の仕組みが大きく変わった。","ステータス","学院生の落書き：「水晶に手をかざすと、己の力が数字になって浮かぶ」",""],
[590,"大書庫の建設","司書長","エイダ","司書長エイダは火災や散逸に備え、歴史書の**写本**を作る大書庫を建設した。ただし第一次魔王戦争の項のみ、原本と写本で記述が異なるとの指摘がある。","写本","書庫の貸出簿の余白：「第七書架の最古の頁は、誰が写しても同じ箇所が空白になる」","しゃほん"],
[640,"第二次魔王戦争","聖女","ミレイユ","封印が緩み、魔王ザガンが復活した。召喚が間に合わず、聖女ミレイユが**祈り**の儀式で再び魔王を封じた。以後、勇者の血を引く者は現れなくなった。","祈り","巡礼者の歌の断片：「古き鎖が軋み、乙女の声がそれを締め直した」","いのり"],
[701,"スローライフ法","王","ヘクトル","戦に倦んだ王ヘクトル3世は、辺境で畑を耕す者に**免税**の特例を与えた。荒廃した農地の復興が進み、平和な時代への転換を象徴する政策となった。","免税","村の祭りの口上：「畑を持てば、年貢の袋は軽くなる。さあ鍬を取れ」","めんぜい"]
];
const $=i=>document.getElementById(i),L=$('log'),U=$('ui'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nz=s=>s.normalize('NFKC').replace(/[\s。、．，・「」『』]/g,'').replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)).toLowerCase();
let AC,snd=true,skip=false,pg=0,hp=100,ms=0,tot=14,bkOK=false,doubt=false;
function sfx(fs,ty='square',d=.12){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*d;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.05,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)})}catch(e){}}
const blip=()=>sfx([880],'triangle',.04);
const bars=()=>{$('hp').style.width=Math.max(0,hp)+'%';$('lv').textContent=pg};
function shake(){try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}const a=$('app');a.classList.remove('sk');void a.offsetWidth;a.classList.add('sk')}
$('sn').onclick=()=>{snd=!snd;$('sn').textContent=snd?'🔊':'🔇'};
L.onclick=()=>skip=true;
const clear=()=>{L.innerHTML=''};
async function say(t,c=''){t=t.replace(/^[告解]。/,'');const p=document.createElement('p');p.className=c;L.appendChild(p);skip=false;
for(let i=1;i<=t.length;i++){if(skip){p.textContent=t;break}p.textContent=t.slice(0,i);if(i%2&&!/[\s。、]/.test(t[i-1]))blip();L.scrollTop=L.scrollHeight;await sleep(c=='h'?14:30)}
L.scrollTop=L.scrollHeight;await sleep(150)}
const V=t=>say(t,'v');
function btns(a){return new Promise(r=>{U.innerHTML='';a.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{sfx([900,1200],'square',.05);U.innerHTML='';r(i)};U.appendChild(b)})})}
function ask(){return new Promise(r=>{inQ=true;U.innerHTML=(bkOK?'<button id="bb">📖 教科書を開いて調べる</button>':'')+'<div class="in"><input id="a" type="text" autocomplete="off" autocapitalize="off" enterkeyhint="send" placeholder="こたえを入力"><button id="g">送信</button></div>';const a=$('a'),go=()=>{const v=a.value.trim();if(!v)return;U.innerHTML='';inQ=false;r(v)};$('g').onclick=go;if(bkOK)$('bb').onclick=bookOpen;a.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)go()};a.focus()})}
// 教科書
function renderBook(w){const n=nz(w),hl=t=>w?t.split(w).join('<mark>'+w+'</mark>'):t,md=t=>hl(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const hit=C.map((c,i)=>i).filter(i=>!n||nz(C[i][0]+C[i][1]+C[i][4]).includes(n));
$('bl').innerHTML=(n?'':'<div class="toc">'+C.map((c,i)=>`<a data-i="${i}">第${i+1}章</a>`).join('')+'</div>')+(hit.map(i=>{const c=C[i];return `<section id="c${i}"><h3>第${i+1}章　${hl(c[1])}（聖暦${hl(String(c[0]))}年）</h3><p>${md(c[4])}</p></section>`}).join('')||'<p>該当する記述はありません。</p>')}
function bookOpen(){$('bk').hidden=false;$('bs').value='';renderBook('');$('bl').scrollTop=0}
$('bx').onclick=()=>{$('bk').hidden=true};
$('bs').oninput=e=>renderBook(e.target.value.trim());
$('bl').onclick=e=>{const i=e.target.dataset.i;if(i!=null)$('c'+i).scrollIntoView({behavior:'smooth'})};
// 問題
function mk(i,t,mem){const c=C[i],S=`次の史料を読み、下の問いに答えよ。\n\n　${c[6]}\n\n問　`;
if(t=='s'){const o=sh([i,...sh(C.map((_,j)=>j).filter(j=>j!=i)).slice(0,2)]),B=['A','B','C'],k=o.map((j,n)=>[C[j][0],B[n]]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join('');return{s:1,q:`次のA〜Cの出来事を、年代の古い順に並べ替え、記号で答えよ。（例：BCA）\n\n${o.map((j,n)=>B[n]+'　'+C[j][1]).join('\n')}`,a:[k],h:`最も古いのは「${C[o[B.indexOf(k[0])]][1]}」`,rv:k}}
if(t=='y')return{y:1,q:mem?`「${c[1]}」が起こった年を、聖暦で答えよ。（算用数字）`:S+'この史料が述べる出来事が起こった年を、聖暦で答えよ。（算用数字）',a:[''+c[0]],h:`聖暦${Math.floor(c[0]/10)*10}年代`,rv:`聖暦${c[0]}年`};
if(t=='p')return{q:mem?`「${c[1]}」の中心人物を答えよ。（名前のみ）`:S+'この史料が述べる出来事の中心人物を答えよ。（名前のみ）',a:[c[3]],h:`「${c[3][0]}」から始まる（${c[3].length}文字）`,rv:c[2]+c[3]};
return{q:mem?`「${c[1]}」に関する、教科書の重要語を答えよ。`:S+'この史料が述べる出来事に関する、教科書の太字の語句を答えよ。',a:i==3?['討伐','封印','トウバツ','フウイン']:[c[5],c[7]],h:`「${c[5][0]}」から始まる（${c[5].length}文字）`,rv:c[5]}}
function judge(q,v){const x=nz(v);if(!x)return false;if(q.s)return x.replace(/[^abc]/g,'')==q.a[0].toLowerCase();if(q.y){const m=x.match(/\d+/);return !!m&&m[0]==q.a[0]}
return q.a.some(a=>{a=nz(a);return a&&(x.includes(a)||(x.length>=2&&a.includes(x)))})}
async function quiz(items,mem){for(let n=0;n<items.length;n++){const [i,t]=items[n],Q=mk(i,t,mem);
await say(`【第${n+1}問】復元 ${pg}/${tot}`,'h');await say(Q.q,'q');
let v=await ask(),ok=judge(Q,v);if(!ok){await say('ヒント：'+Q.h+'（もう一度だけ答えられます）','ng');v=await ask();ok=judge(Q,v)}
if(ok){pg++;bars();sfx([660,880,1320],'square',.07);
if(!mem&&i==3&&t=='k'){doubt=/封|フウ/.test(nz(v));await say(doubt?'告。…不一致。……いえ、許容します。':'解。正解です。頁が一枚、書き戻されました。','k')}
else await say(['解。正解です。頁が一枚、書き戻されました。','告。復元を確認。','解。見事です。'][n%3],'k')}
else{ms++;hp-=25;bars();sfx([120,90],'sawtooth',.18);shake();await say(`【誤答】HP-25　正答は「${Q.rv}」`,'ng');if(hp<=0)return false}}
return true}
async function act(items,mem){const p0=pg,m0=ms;for(;;){hp=100;bars();if(await quiz(items,mem))return;pg=p0;ms=m0;bars();await say('警告。HPがゼロ。復元した頁が白紙に戻ります。','w');await btns(['もう一度 ▶'])}}
const rt=a=>a[Math.floor(Math.random()*a.length)],ids=()=>sh(C.map((_,i)=>i));
const mem=(n,t=['y','p','k','s'])=>ids().slice(0,n).map(i=>[i,rt(t)]);
async function memo(s){clear();L.innerHTML='<p class="h">暗記タイム　残り<b id="tm">'+s+'</b>秒</p>'+C.map(c=>`<p>聖暦${c[0]}年　${c[1]}<br><span class="k">${c[2]}${c[3]}／${c[5]}</span></p>`).join('');
let t=s;const iv=setInterval(()=>{t--;$('tm').textContent=t},1000);await Promise.race([btns(['暗記完了 ▶']),sleep(s*1000)]);clearInterval(iv);U.innerHTML='';sfx([300,200],'sawtooth',.2);clear();await say('告。書物の消去を開始…………完了。','w')}
function card(t,x){const R=ms<=1?['S','白紙を埋める者']:ms<=3?['A','見習い司書']:['B','迷える読者'];L.insertAdjacentHTML('beforeend',`<div class="st"><div class="rk">${R[0]}</div>${t}<br>称号：${R[1]}<br>復元：${pg}/${tot}頁　ミス：${ms}回　カンニング：${peek}回${x||''}</div>`);sfx([784,988,1175],'square',.15);L.scrollTop=L.scrollHeight}
const LOGO='<div class="ti"><svg viewBox="0 0 120 120" width="96" height="96"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd8ff"/><stop offset="1" stop-color="#4fd8ff" stop-opacity=".05"/></linearGradient></defs><polygon points="60,6 108,33 108,87 60,114 12,87 12,33" fill="none" stroke="#4fd8ff" stroke-width="2"/><path d="M60 40Q40 30 22 36V84Q40 78 60 88Q80 78 98 84V36Q80 30 60 40Z" fill="url(#lg)" stroke="#c8efff" stroke-width="2"/><path d="M60 40V88" stroke="#c8efff"/><path d="M30 50h22M30 60h18M30 70h12M68 50h22M68 60h14M68 70h8" stroke="#c8efff" stroke-width="2" stroke-dasharray="6 5" opacity=".6"/></svg><b>その歴史、<br>だいたい合ってる。</b><em>ALMOST-TRUE CHRONICLE</em><small>親指ひとつで、世界の歴史を書き戻せ。<br>📱 縦持ち推奨　🔊 音が出ます</small></div>';
let inQ=false,peek=0;
const HR=new Date().getHours(),DEV=/iPhone|iPad/.test(navigator.userAgent)?'iPhone':/Android/.test(navigator.userAgent)?'Android端末':'パソコン';
async function bat(){try{const b=await navigator.getBattery();return Math.round(b.level*100)}catch(e){return null}}

en=()=>{if(t0){clearInterval(iv);t0=0;b.textContent='封印が破れた！もう一度押し続けて';sfx([150],'sawtooth',.25);shake()}};
b.addEventListener('pointerdown',st);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,en));b.oncontextmenu=e=>e.preventDefault()})}
