<!DOCTYPE html>

<style>

<script>

const Q=[
["女神アルセイアが人間に魔法を授けたのは、聖暦何年のことか。",["1"],"教科書を確認してください。",1,"聖暦1年"],
["竜王ヴァルガと盟約を結んだ、初代王の名は。",["エルド"],"教科書を確認してください。",0,"エルド"],
["勇者タクミが魔王ザガンを倒したと言われる、第一次魔王戦争は聖暦何年のことか。",["245"],"教科書を確認してください。",1,"聖暦245年"],

const $=i=>document.getElementById(i),F=$('field'),C=$('cmd'),M=$('msg'),sleep=ms=>new Promise(r=>setTimeout(r,ms));

let AC,snd=true,skip=false,typing=false,tap=null,pg=0,bkOK=false;
function sfx(fs,ty='square',d=.1){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*d;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.05,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)})}catch(e){}}
const blip=()=>sfx([700],'square',.03);

// メッセージ表示。すべてのセリフはタップするまで次へ進まない。
async function say(t,opt={}){
// 長文は文末・読点を優先して分割。句末の文字だけが次画面に孤立しないようにする。
if(t.length>26){
 const chunks=[];let rest=t.replace(/\s*\n+\s*/g,'');
 while(rest.length>26){let cut=-1;
  for(let i=Math.min(26,rest.length);i>=12;i--){if(/[。！!？?]/.test(rest[i-1])){cut=i;break}}
  if(cut<0){for(let i=Math.min(26,rest.length);i>=12;i--){if(/[、，]/.test(rest[i-1])){cut=i;break}}}
  if(cut<0)break;
  chunks.push(rest.slice(0,cut));rest=rest.slice(cut);
 }
 if(rest)chunks.push(rest);
 if(chunks.length>1){for(const part of chunks)await say(part,opt);return}
}
$('nm').textContent=opt.n===undefined?'叡智の声':opt.n;M.textContent='';skip=false;typing=true;
for(let i=1;i<=t.length;i++){if(skip){M.textContent=t;break}M.textContent=t.slice(0,i);if(i%2&&!/[\s。、…\n]/.test(t[i-1]))blip();await sleep(opt.sp||34)}

$('nx').style.visibility='visible';await new Promise(r=>tap=r)}
function btns(a){return new Promise(r=>{C.innerHTML='';a.forEach((t,i)=>{const b=document.createElement('button');b.className='btn win';b.textContent=t;b.onclick=()=>{sfx([900,1200],'square',.05);C.innerHTML='';r(i)};C.appendChild(b)})})}
function renderBook(w){const n=nz(w),hl=t=>w?t.split(w).join('<mark>'+w+'</mark>'):t;
const h=T.filter(p=>!n||nz(p).includes(n)).map(p=>'<p>'+hl(p.replace(/\*\*/g,'')).replace(new RegExp('(魔法|エルド|盟約|討伐|写本|復活|祈り)','g'),'<b>$1</b>')+'</p>');
$('bl').innerHTML=h.join('')||'<p>見つかりませんでした。</p>'}
function bookOpen(){$('bk').hidden=false;$('bs').value='';renderBook('');$('bl').scrollTop=0}
$('bx').onclick=()=>{$('bk').hidden=true};$('bs').oninput=e=>renderBook(e.target.value.trim());
function judge(q,v){const x=nz(v);if(!x)return false;if(q[3]){const m=x.match(/\d+/);return !!m&&m[0]===q[1][0]}return q[1].some(a=>x.includes(nz(a)))}
function seal(){return new Promise(r=>{C.innerHTML='<button id="sl" class="btn win" style="text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-height:80px">🖐 ここを3秒、押し続ける</button>';const b=$('sl');let t0=0,iv=0;
const st=e=>{e.preventDefault();t0=Date.now();clearInterval(iv);iv=setInterval(()=>{const d=Date.now()-t0;b.textContent='封印中… '+(d/1000).toFixed(1)+' / 3.0秒';sfx([440+d/6],'triangle',.08);try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}if(d>=3000){clearInterval(iv);C.innerHTML='';sfx([523,659,784,1047],'square',.12);r()}},100)},
en=()=>{if(t0){clearInterval(iv);t0=0;b.textContent='指をはなすと失敗！もう一度、押し続けて！';sfx([150],'sawtooth',.25);shake()}};
b.addEventListener('pointerdown',st);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,en));b.oncontextmenu=e=>e.preventDefault()})}
const head=(t,q='')=>{F.innerHTML=`<div class="big">${t}</div>${q?'<div class="question">'+q+'</div>':''}`};
function clearDialogue(){M.textContent='';$('nm').textContent='';$('nx').style.visibility='hidden'}
function ensureAnswerRow(){
 let w=$('answerRow');
 if(!w){w=document.createElement('div');w.id='answerRow';w.className='row';w.innerHTML='<input id="a" class="in" type="text" autocomplete="off" autocapitalize="off" enterkeyhint="send" placeholder="ここに入力"><button id="g" class="btn win send">送信</button><button id="dontknow" class="btn win">わからない</button>';C.appendChild(w)}
 return w;
}
async function showQuestion(t,q){
 clearDialogue();
 C.style.opacity='0';C.style.pointerEvents='none';
 F.style.opacity='0';F.style.transform='translateY(10px)';
 await sleep(450);
 head(t,q);
 ensureAnswerRow();
 // フェードイン前に前の入力を消去し、古い回答が一瞬だけ見えるのを防ぐ。
 const prevInput=$('a'),prevSend=$('g'),prevDont=$('dontknow');
 if(prevInput){prevInput.value='';prevInput.defaultValue='';prevInput.disabled=false;}
 if(prevSend)prevSend.disabled=false;
 if(prevDont)prevDont.disabled=false;
 // 両方の配置を先に確定させ、問題文と解答欄を同じタイミングでフェードイン。
 await sleep(40);
 F.style.opacity='1';F.style.transform='translateY(0)';
 C.style.opacity='1';C.style.pointerEvents='';
 await sleep(500);
}
let miss=0;
const ld=()=>{try{return JSON.parse(localStorage.getItem('isekai_test')||'{}')}catch(e){return {}}};
const sv=o=>{try{localStorage.setItem('isekai_test',JSON.stringify(o))}catch(e){}};
function ask(sk){return new Promise(r=>{
clearDialogue();
const dock=$('bookDock');dock.classList.toggle('visible',bkOK);
ensureAnswerRow();
let a=$('a'),g=$('g'),b=$('dontknow');a.value='';a.disabled=false;g.disabled=false;b.disabled=false;
b.onclick=()=>{a.disabled=true;g.disabled=true;b.disabled=true;r(null)};
const go=()=>{const v=a.value.trim();if(!v)return;a.disabled=true;g.disabled=true;b.disabled=true;r(v)};g.onclick=go;a.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)go()};
})}
async function quiz(n){const q=Q[n];await showQuestion('第'+(n+1)+'問',q[0]);
let v=await ask(1),ok=v!==null&&judge(q,v);
if(v===null||!ok){miss++;sfx([120,90],'sawtooth',.15);
if(v===null)await say('……分からない、ですね。'+q[2]+'\n解答は、あと一度だけ受け付けます。',{nowait:1});
else if(miss>1){shake();await say('…………どうか、解いてください。\n'+q[2],{nowait:1})}
else await say('……誤りです。'+q[2]+'\n解答は、あと一度だけ受け付けます。',{nowait:1});
v=await ask(1);ok=v!==null&&judge(q,v)}
if(ok){pg++;SOL.push(n+1);bars();sfx([660,880,1320],'square',.07);return 1}
sfx([120,90],'sawtooth',.18);shake();await say('誤。正しくは「'+q[4]+'」です。');return 0}
function card(t,sub,x){F.innerHTML=`<div class="end"><div class="mid">${t}</div><div class="sm">${sub}</div>${x?'<div class="sm" style="margin-top:8px;color:#fff">'+x+'</div>':''}</div>`;sfx([784,988,1175],'square',.15)}
const seq=async a=>{for(const t of a)await say(t)};
let LC=0,SOL=[],BADF=0;
const EN=[['b','だいたい合ってた。','すべてを解いて、嘘を信じた者へ'],['l','ほとんど合ってた。','真実に気づきながら、解きすぎた者へ'],['t','ぜんぶ合ってる。','鎖を残し、真実を告げた者へ'],['z','なにも解かなかった。','なにも、しなかった者へ']];
const gal=S=>EN.map(x=>(S.e||{})[x[0]]?'★ '+x[1]:'？？？　'+x[2]).join('<br>');
function fin(id,t,sub,x){const S=ld();S.e=S.e||{};S.e[id]=1;BADF=(id==='b'||id==='l')?1:0;if(BADF){const b=[1,2,3,4].filter(k=>SOL.includes(k));x='外れた鎖：'+b.length+'本（'+(b.map(k=>'第'+k+'問').join('・')||'なし')+'）<br>……解かなければ、外れなかった鎖。'}S.p=(S.p||0)+1;S.last=LC;if(id==='t'||id==='z')S.t=1;sv(S);const n=Object.keys(S.e).length;
F.innerHTML=`<div class="end"><div class="big">${t.startsWith('TRUE')?'TRUE END':'BAD END'}</div></div>`;sfx([784,988,1175],'square',.15)}
async function unmask(){F.innerHTML='';const mw=$('mw'),G='■▲◆▼●※＃░▒',r=()=>G[Math.floor(Math.random()*G.length)];
C.innerHTML='';$('bookDock').classList.remove('visible');$('nx').style.visibility='hidden';sfx([110,80,55],'sawtooth',.3);
for(let i=0;i<16;i++){mw.classList.toggle('zg',i%2===0);$('nm').textContent=i<9?'叡'+r()+'の'+r():r()+r()+r()+r();M.textContent=Array.from({length:18},()=>Math.random()<.5?r():'　').join('');if(i%3===0)sfx([150+Math.random()*700],'square',.05);await sleep(75)}
mw.classList.add('zg');$('nm').textContent='魔王ザガン';M.textContent='';sfx([55,45],'sawtooth',.5);await sleep(700)}
async function game(){pg=0;miss=0;SOL=[];$('mw').classList.remove('zg');bars();bkOK=false;$('bookDock').classList.remove('visible');F.innerHTML='';M.textContent='';$('nm').textContent='';$('top').style.opacity=0;
const S=ld();await sleep(1800);
const I=0?['受験者を確認。……あなたは、もうわたしを封じた方ですね。','では今回は、ただの試験として。','気楽に、どうぞ。','……試験を開始します。']
:0?['受験者を確認。……おかえりなさい。',(S.last==null||S.last>=3)?'前回、あなたは'+(S.last==null?'たくさんの':S.last+'問も')+'問題を解いてくれました。とても助かりました。':'前回は、'+S.last+'問しか解いてくれませんでしたね。……今回は、期待しています。','今回も、よろしくお願いします。','……試験を開始します。']
:['受験者を確認。ようこそ、異世界へ。','これは、この世界の歴史についての試験です。','問題は5つ。教科書は自由に見て構いません。','全問正解は不要です。歴史の真実さえ覚えていれば。','……試験を開始します。'];

$('top').style.opacity=1;bkOK=true;M.textContent='';
C.innerHTML='';$('bookDock').classList.toggle('visible',bkOK);
await say('下の「📖 教科書を調べる」から、いつでも教科書を開けます。');
if(await quiz(0))await say('解。正解です。',{auto:700});
if(await quiz(1))await say('解。正解です。順調ですね。',{auto:900});
if(await quiz(2)){await say('解。正解です。',{auto:900});await say('………………。',{auto:1500,sp:120});shake();sfx([180,140,200],'sawtooth',.2);await say('失礼。……少し、声が弾みました。',{auto:1000})}

await say('第二次魔王戦争は、魔王の封印が緩んだことで始まりました。');
await say('…………。',{auto:1400,sp:120});await say('次が、最後の問題です。');
const c=pg;LC=c;await showQuestion('最終問題','第一次魔王戦争で、魔王ザガンはどうなりましたか。');bkOK=true;$('bookDock').classList.add('visible');
let a;for(;;){const raw=await ask(1);if(raw===null){a=0;break}const v=nz(raw);if(/封|フウ|生キ|死ンデ?ナイ|ヨミガエ|復活|フッカツ/.test(v)){a=1;break}if(/討|倒|トウバ|タオ|死ン|殺|コロ|ヤッツ/.test(v)){a=0;break}await say('……もう少し、はっきり答えてください。',{nowait:1})}

const zq=async a=>{for(const t of a){const parts=t.split(/\n+/).flatMap(line=>line.trim().split(/(?<=[。！!？?])/).map(x=>x.trim()).filter(Boolean));for(const p of parts)await say(p,{n:'魔王ザガン'})}};
const z='我が名は、魔王ザガン。\n肉体を封じられても、魂までは消えなかった。\nこの試験は、貴様に封印を解かせるための罠だ。';
const ch='問題に正解するたびに、封印の鎖は一本ずつ外れる。\nそういう試験だったのだ。';
